name: ReelForge AI - Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Verify AI and MP4 features
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const s=fs.readFileSync("app.js","utf8");for(const id of ["audioFile","audioPlayer","previewCanvas","exportBtn","lyricsInput","geminiKey","autoCreateBtn","aiStatus"])if(!h.includes("id=\""+id+"\""))throw Error("Missing "+id);for(const f of ["function convertToMp4(","video/mp4","libx264","gemini-2.5-flash","function lyricLines()","new MediaRecorder"])if(!s.includes(f))throw Error("Missing "+f);console.log("AI and MP4 feature checks passed")'
      - name: Verify export recovery
        run: node -e 'const s=require("fs").readFileSync("app.js","utf8");if(!s.includes("Export interrupted"))throw Error("Missing recovery");console.log("Recovery check passed")'
