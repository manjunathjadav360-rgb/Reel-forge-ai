name: AIKIVO - Validate and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check supabase/client.js
          node --check supabase/config.js
      - name: Verify AIKIVO app files and core screens
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f supabase/schema.sql
          test -f supabase/config.js
          test -f supabase/client.js
          test -f auth.js
          test -f supabase/functions/aikivo-ai/index.ts
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");for(const id of ["page-overview","page-agents","page-knowledge","page-conversations","page-phone","page-settings","agentForm","knowledgeForm","chatForm","launchCenter","launchExecutiveSelect","launchPublishButton","launchEmbedCode"])if(!h.includes(id))throw Error("Missing UI element: "+id);console.log("AIKIVO screens verified")'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
