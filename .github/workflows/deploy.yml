name: Deploy ReelForge AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate editor JavaScript
        run: node --check app.js
      - name: Check required studio elements
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const ids=['audioFile','videoFile','audioPlayer','previewCanvas','audioName','audioMeta','audioDetails','durationLabel','videoName','playBtn','exportBtn','previewEmpty','previewNote','captionInput','progressWrap','progressBar','progressText','aboutDialog','styleGrid','helpBtn','closeDialog','okDialog'];const missing=ids.filter(id=>!h.includes('id=\\\"'+id+'\\\"'));if(missing.length){console.error('Missing HTML ids:',missing.join(', '));process.exit(1)}console.log('Studio element check passed')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
